<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Modal Variants — Live _pickVariant Preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f7f8fb; min-height:100vh; padding:40px 20px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
        .toolbar { max-width:720px; margin:0 auto 24px; text-align:center; }
        .toolbar h1 { font-size:20px; color:#1d1f2a; margin-bottom:8px; }
        .toolbar p  { font-size:13px; color:#5e6b8a; margin-bottom:20px; }
        .toolbar .btn { margin:4px; }
        .stats { max-width:720px; margin:24px auto 0; padding:12px 16px; background:#fff; border-radius:8px; font-size:13px; color:#5e6b8a; }
        .stats code { background:#f0f4ff; padding:2px 6px; border-radius:4px; }
    </style>
</head>
<body>
    <div class="toolbar">
        <h1>FAQ Modal Variants — Live <code>_pickVariant</code> Preview</h1>
        <p>Bấm nút bên dưới để chạy <code>_pickVariant(content)</code> trên content thật → inject + open modal. Variant được chọn random mỗi lần.</p>
        <button type="button" id="btn-pick" class="btn btn-primary">Random pick + Show</button>
        <button type="button" id="btn-reset" class="btn btn-outline-secondary">Reset</button>
    </div>
    <div class="stats" id="stats">Chưa pick lần nào.</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // _pickVariant — copy 1:1 từ notification-client.js (mới)
        var _pickVariant = function (content) {
            if (!content || typeof content !== 'string') return '';
            var MARKER = '<!--##VARIANT##-->';
            if (content.indexOf(MARKER) === -1) return content;
            try {
                var tmp = document.createElement('div');
                tmp.innerHTML = content;
                var modals = tmp.querySelectorAll('.modal');
                if (modals.length === 1) {
                    var bodies = modals[0].querySelectorAll('.modal-body');
                    if (bodies.length > 1) {
                        var keepIdx = Math.floor(Math.random() * bodies.length);
                        for (var i = 0; i < bodies.length; i++) {
                            if (i !== keepIdx) bodies[i].parentNode.removeChild(bodies[i]);
                        }
                        return tmp.innerHTML;
                    }
                }
            } catch (e) {}
            var parts = content.split(MARKER).map(function(s){return s.replace(/^\s+|\s+$/g,'');}).filter(function(s){return s.length>0;});
            if (parts.length === 0) return '';
            if (parts.length === 1) return parts[0];
            return parts[Math.floor(Math.random() * parts.length)];
        };

        var contentPromise = fetch('faq-modal-variants.html').then(function(r){return r.text();});
        var counts = { total: 0 };
        var statsEl = document.getElementById('stats');

        function renderStats() {
            if (counts.total === 0) { statsEl.textContent = 'Chưa pick lần nào.'; return; }
            var lines = ['Total picks: <b>' + counts.total + '</b>'];
            Object.keys(counts).filter(function(k){return k !== 'total';}).forEach(function(k){
                lines.push('  ' + counts[k] + 'x &nbsp; ' + k);
            });
            statsEl.innerHTML = lines.join('<br>');
        }

        function cleanupExisting() {
            var existing = document.getElementById('notification-default-modal');
            if (existing) {
                var inst = bootstrap.Modal.getInstance(existing);
                if (inst) inst.dispose();
                existing.parentNode.removeChild(existing);
            }
            document.querySelectorAll('.modal-backdrop').forEach(function(b){b.parentNode.removeChild(b);});
            document.body.classList.remove('modal-open');
            document.body.style.cssText = '';
        }

        document.getElementById('btn-pick').addEventListener('click', function() {
            contentPromise.then(function(content) {
                cleanupExisting();
                var picked = _pickVariant(content);
                document.body.insertAdjacentHTML('beforeend', picked);
                var el = document.getElementById('notification-default-modal');
                if (!el) return alert('No modal found after pick');
                var tmp = document.createElement('div');
                tmp.innerHTML = picked;
                var h6 = tmp.querySelector('h6');
                var title = h6 ? h6.textContent.trim().substring(0, 50) : '(no h6)';
                counts.total++;
                counts[title] = (counts[title] || 0) + 1;
                renderStats();
                var modal = new bootstrap.Modal(el, { backdrop: true });
                modal.show();
            });
        });

        document.getElementById('btn-reset').addEventListener('click', function() {
            counts = { total: 0 };
            cleanupExisting();
            renderStats();
        });
    </script>
</body>
</html>
